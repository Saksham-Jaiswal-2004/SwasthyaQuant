# Expect this to win the accuracy column. Say so on the slide before a judge does.
# max_depth 3, not 6: 918 rows overfit fast, and an overfitted baseline is an unfair
# baseline in the quantum model's favour -- the same error mirrored.
model:
  name: xgboost
  params:
    n_estimators: 400
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
