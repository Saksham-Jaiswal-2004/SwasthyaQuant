[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qheart"
version = "0.1.0"
description = "Hybrid quantum-classical ML for early heart disease detection (SIH 2026, PS 26139)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "quantum: needs pennylane/qiskit installed (skipped in CI)",
  "slow: takes more than a few seconds",
  "needs_data: needs data/raw/heart.csv present (skipped in CI)",
  "needs_sklearn: needs scikit-learn installed",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
